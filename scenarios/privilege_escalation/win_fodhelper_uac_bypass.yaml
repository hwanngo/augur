scenario_metadata:
  scenario_id: "SCEN-WIN-007"
  name: "UAC Bypass via fodhelper.exe"
  description: "Adversary abuses fodhelper.exe auto-elevation to spawn a high-integrity cmd.exe shell without a UAC prompt."
  severity: "HIGH"
  mitre_mappings:
    - { tactic: "TA0004", technique: "T1548.002" }
  os_family: "windows"
spatial_constraints:
  applicable_zones: ["User_Endpoint", "Internal_Server"]
  critical_assets_only: false
  required_log_sources: ["Windows_Sysmon"]
attack_sequence_flow:
  steps:
    - step_id: 1
      name: "Registry_Hijack"
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["reg.exe"] }
        CommandLine: { regex: ".*shell.*" }
    - step_id: 2
      name: "Fodhelper_Launch"
      temporal_link: { previous_step: 1, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 60 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["fodhelper.exe"] }
    - step_id: 3
      name: "High_Integrity_Shell"
      temporal_link: { previous_step: 2, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 60 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["cmd.exe"] }
        ParentProcessName: { in: ["fodhelper.exe"] }
actionable_hunting_outputs:
  validation_queries:
    - engine: "KQL"
      query: "DeviceProcessEvents | where InitiatingProcessFileName == 'fodhelper.exe' and FileName == 'cmd.exe'"
