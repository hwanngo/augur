scenario_metadata:
  scenario_id: "SCEN-LNX-005"
  name: "Linux Log Shredding and History Clearing"
  description: "Adversary shreds log files under /var/log and clears bash history to cover tracks after initial exploitation."
  severity: "HIGH"
  mitre_mappings:
    - { tactic: "TA0005", technique: "T1070.002" }
  os_family: "linux"
spatial_constraints:
  applicable_zones: ["Internal_Server", "DMZ"]
  critical_assets_only: false
  required_log_sources: ["Linux_Auditd"]
attack_sequence_flow:
  steps:
    - step_id: 1
      name: "Spawn_Shell"
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["bash", "sh"] }
        CommandLine: { regex: ".*exploit.*" }
    - step_id: 2
      name: "Shred_Logs"
      temporal_link: { previous_step: 1, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 300 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["shred", "rm"] }
        CommandLine: { regex: ".*log.*" }
    - step_id: 3
      name: "Clear_History"
      temporal_link: { previous_step: 2, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 120 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["bash"] }
        CommandLine: { regex: ".*history.*" }
actionable_hunting_outputs:
  validation_queries:
    - engine: "Sigma"
      query: |
        title: Linux Log Shredding
        logsource: { product: linux, category: process_creation }
        detection:
          sel: { Image|endswith: '/shred', CommandLine|contains: '/var/log' }
          condition: sel
        level: high
