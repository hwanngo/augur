scenario_metadata:
  scenario_id: "SCEN-CLD-001"
  name: "Cloud-stub: AWS Access-Key Theft via Credentials File + CLI Enumeration"
  description: "Endpoint-telemetry approximation of cloud credential theft: a shell reads ~/.aws/credentials and uses the AWS CLI to enumerate identity. (Approximates CloudTrail activity via host endpoint logs.)"
  severity: "HIGH"
  mitre_mappings:
    - { tactic: "TA0006", technique: "T1552.001" }
  os_family: "linux"
spatial_constraints:
  applicable_zones: ["Internal_Server", "DMZ"]
  critical_assets_only: false
  required_log_sources: ["Linux_Auditd"]
attack_sequence_flow:
  steps:
    - step_id: 1
      name: "Read_AWS_Credentials"
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["cat", "grep"] }
        CommandLine: { regex: ".*credentials.*" }
    - step_id: 2
      name: "AWS_CLI_Identity_Enum"
      temporal_link: { previous_step: 1, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 120 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["aws"] }
        CommandLine: { regex: ".*sts.*" }
    - step_id: 3
      name: "AWS_CLI_Resource_Enum"
      temporal_link: { previous_step: 2, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 300 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["aws"] }
        CommandLine: { regex: ".*list.*" }
actionable_hunting_outputs:
  validation_queries:
    - engine: "KQL"
      query: "DeviceProcessEvents | where FileName == 'aws' and ProcessCommandLine has_any ('sts','list')"
