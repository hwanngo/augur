scenario_metadata:
  scenario_id: "SCEN-MAC-005"
  name: "macOS Process and System Discovery via ps and system_profiler"
  description: "Adversary enumerates running processes with ps aux and gathers system profile information via system_profiler."
  severity: "LOW"
  mitre_mappings:
    - { tactic: "TA0007", technique: "T1057" }
  os_family: "macos"
spatial_constraints:
  applicable_zones: ["User_Endpoint"]
  critical_assets_only: false
  required_log_sources: ["macOS_ESF"]
attack_sequence_flow:
  steps:
    - step_id: 1
      name: "Process_List"
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["ps"] }
        CommandLine: { regex: ".*aux.*" }
    - step_id: 2
      name: "System_Profile"
      temporal_link: { previous_step: 1, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 120 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["system_profiler"] }
    - step_id: 3
      name: "Network_Interfaces"
      temporal_link: { previous_step: 2, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 120 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["ifconfig", "networksetup"] }
actionable_hunting_outputs:
  validation_queries:
    - engine: "KQL"
      query: "DeviceProcessEvents | where FileName in ('ps','system_profiler') | summarize count() by DeviceName, bin(Timestamp, 5m)"
