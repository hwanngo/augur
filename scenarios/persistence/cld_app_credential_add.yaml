scenario_metadata:
  scenario_id: "SCEN-CLD-003"
  name: "Cloud-stub: Azure App Registration Credential Addition via PowerShell"
  description: "Endpoint-telemetry approximation of OAuth app backdooring: adversary creates a new Azure app registration and adds credentials for persistent access. (Approximates Azure AD audit logs via endpoint telemetry.)"
  severity: "CRITICAL"
  mitre_mappings:
    - { tactic: "TA0003", technique: "T1098.001" }
  os_family: "windows"
spatial_constraints:
  applicable_zones: ["User_Endpoint", "Internal_Server"]
  critical_assets_only: false
  required_log_sources: ["Windows_Sysmon"]
attack_sequence_flow:
  steps:
    - step_id: 1
      name: "Create_App_Registration"
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["powershell.exe"] }
        CommandLine: { regex: ".*New-MgApplication.*" }
    - step_id: 2
      name: "Add_App_Password"
      temporal_link: { previous_step: 1, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 120 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["powershell.exe"] }
        CommandLine: { regex: ".*AddPassword.*" }
    - step_id: 3
      name: "Confirm_Access"
      temporal_link: { previous_step: 2, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 300 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["powershell.exe"] }
        CommandLine: { regex: ".*Get-MgApplication.*" }
actionable_hunting_outputs:
  validation_queries:
    - engine: "KQL"
      query: "DeviceProcessEvents | where FileName == 'powershell.exe' and ProcessCommandLine has_any ('New-MgApplication','AddPassword')"
