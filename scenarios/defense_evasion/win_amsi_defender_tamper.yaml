scenario_metadata:
  scenario_id: "SCEN-WIN-008"
  name: "AMSI and Defender Tamper via Set-MpPreference"
  description: "Adversary disables Defender real-time monitoring via PowerShell Set-MpPreference to evade detection before payload execution."
  severity: "HIGH"
  mitre_mappings:
    - { tactic: "TA0005", technique: "T1562.001" }
  os_family: "windows"
spatial_constraints:
  applicable_zones: ["User_Endpoint", "Internal_Server"]
  critical_assets_only: false
  required_log_sources: ["Windows_Sysmon"]
attack_sequence_flow:
  steps:
    - step_id: 1
      name: "Disable_Realtime_Monitoring"
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["powershell.exe"] }
        CommandLine: { regex: ".*Set-MpPreference.*" }
    - step_id: 2
      name: "Child_Process_Spawned"
      temporal_link: { previous_step: 1, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 120 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["cmd.exe", "wscript.exe"] }
        ParentProcessName: { in: ["powershell.exe"] }
    - step_id: 3
      name: "Payload_Execute"
      temporal_link: { previous_step: 2, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 300 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["rundll32.exe", "regsvr32.exe"] }
actionable_hunting_outputs:
  validation_queries:
    - engine: "KQL"
      query: "DeviceProcessEvents | where FileName == 'powershell.exe' and ProcessCommandLine has 'Set-MpPreference'"
