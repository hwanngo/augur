scenario_metadata:
  scenario_id: "SCEN-MAC-004"
  name: "macOS Quarantine Attribute Removal via xattr"
  description: "Adversary removes the com.apple.quarantine extended attribute from a downloaded binary and marks it executable."
  severity: "MEDIUM"
  mitre_mappings:
    - { tactic: "TA0005", technique: "T1553.001" }
  os_family: "macos"
spatial_constraints:
  applicable_zones: ["User_Endpoint"]
  critical_assets_only: false
  required_log_sources: ["macOS_ESF"]
attack_sequence_flow:
  steps:
    - step_id: 1
      name: "Remove_Quarantine"
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["xattr"] }
        CommandLine: { regex: ".*quarantine.*" }
    - step_id: 2
      name: "Mark_Executable"
      temporal_link: { previous_step: 1, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 60 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["chmod"] }
        CommandLine: { regex: ".*x.*" }
    - step_id: 3
      name: "Execute_Binary"
      temporal_link: { previous_step: 2, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 60 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["sh", "bash"] }
        CommandLine: { regex: ".*exec.*" }
actionable_hunting_outputs:
  validation_queries:
    - engine: "KQL"
      query: "DeviceProcessEvents | where FileName == 'xattr' and ProcessCommandLine has 'quarantine'"
