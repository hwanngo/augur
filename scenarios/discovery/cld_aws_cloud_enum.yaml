scenario_metadata:
  scenario_id: "SCEN-CLD-004"
  name: "Cloud-stub: AWS Cloud Resource Enumeration via AWS CLI"
  description: "Endpoint-telemetry approximation of AWS cloud enumeration: adversary uses aws CLI to describe EC2 instances and list IAM resources. (Approximates CloudTrail DescribeInstances/ListUsers via endpoint telemetry.)"
  severity: "MEDIUM"
  mitre_mappings:
    - { tactic: "TA0007", technique: "T1580" }
  os_family: "linux"
spatial_constraints:
  applicable_zones: ["Internal_Server", "DMZ"]
  critical_assets_only: false
  required_log_sources: ["Linux_Auditd"]
attack_sequence_flow:
  steps:
    - step_id: 1
      name: "EC2_Describe"
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["aws"] }
        CommandLine: { regex: ".*ec2 describe.*" }
    - step_id: 2
      name: "IAM_List_Users"
      temporal_link: { previous_step: 1, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 120 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["aws"] }
        CommandLine: { regex: ".*iam list.*" }
    - step_id: 3
      name: "S3_List_Buckets"
      temporal_link: { previous_step: 2, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 120 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["aws"] }
        CommandLine: { regex: ".*s3 ls.*" }
actionable_hunting_outputs:
  validation_queries:
    - engine: "KQL"
      query: "DeviceProcessEvents | where FileName == 'aws' and ProcessCommandLine has_any ('ec2 describe','iam list','s3 ls')"
