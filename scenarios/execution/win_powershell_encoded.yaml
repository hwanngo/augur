scenario_metadata:
  scenario_id: "SCEN-WIN-005"
  name: "PowerShell Encoded Command Chain to Rundll32"
  description: "Adversary chains PowerShell with -nop bypass flag, encodes the payload, and ultimately spawns rundll32 as the second-stage executor."
  severity: "HIGH"
  mitre_mappings:
    - { tactic: "TA0002", technique: "T1059.001" }
  os_family: "windows"
spatial_constraints:
  applicable_zones: ["User_Endpoint", "Internal_Server"]
  critical_assets_only: false
  required_log_sources: ["Windows_Sysmon"]
attack_sequence_flow:
  steps:
    - step_id: 1
      name: "PowerShell_Nop"
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["powershell.exe"] }
        CommandLine: { regex: ".*-nop.*" }
    - step_id: 2
      name: "PowerShell_Encoded"
      temporal_link: { previous_step: 1, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 120 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["powershell.exe"] }
        CommandLine: { regex: ".*-enc.*" }
    - step_id: 3
      name: "Rundll32_Spawn"
      temporal_link: { previous_step: 2, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 120 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["rundll32.exe"] }
        ParentProcessName: { in: ["powershell.exe"] }
actionable_hunting_outputs:
  validation_queries:
    - engine: "KQL"
      query: "DeviceProcessEvents | where FileName == 'powershell.exe' and ProcessCommandLine has_any ('-nop','-enc')"
