scenario_metadata:
  scenario_id: "SCEN-WIN-013"
  name: "Data Exfiltration via PowerShell Invoke-WebRequest POST"
  description: "Adversary stages collected data and exfiltrates it via PowerShell Invoke-WebRequest POST to an external host."
  severity: "HIGH"
  mitre_mappings:
    - { tactic: "TA0010", technique: "T1048" }
  os_family: "windows"
spatial_constraints:
  applicable_zones: ["User_Endpoint", "Internal_Server"]
  critical_assets_only: false
  required_log_sources: ["Windows_Sysmon"]
attack_sequence_flow:
  steps:
    - step_id: 1
      name: "Stage_Data"
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["powershell.exe"] }
        CommandLine: { regex: ".*compress.*" }
    - step_id: 2
      name: "PowerShell_WebRequest_POST"
      temporal_link: { previous_step: 1, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 300 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["powershell.exe"] }
        CommandLine: { regex: ".*Invoke-WebRequest.*" }
    - step_id: 3
      name: "Confirm_Exfil"
      temporal_link: { previous_step: 2, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 120 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["powershell.exe"] }
        CommandLine: { regex: ".*POST.*" }
actionable_hunting_outputs:
  validation_queries:
    - engine: "KQL"
      query: "DeviceProcessEvents | where FileName == 'powershell.exe' and ProcessCommandLine has 'Invoke-WebRequest'"
