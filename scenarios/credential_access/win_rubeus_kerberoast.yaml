scenario_metadata:
  scenario_id: "SCEN-WIN-015"
  name: "Kerberoasting via Rubeus Tool"
  description: "Adversary loads Rubeus via PowerShell and performs Kerberoasting to request TGS tickets, followed by loading an unsigned assembly."
  severity: "CRITICAL"
  mitre_mappings:
    - { tactic: "TA0006", technique: "T1558.003" }
  os_family: "windows"
spatial_constraints:
  applicable_zones: ["User_Endpoint", "Internal_Server", "Active_Directory"]
  critical_assets_only: false
  required_log_sources: ["Windows_Sysmon"]
attack_sequence_flow:
  steps:
    - step_id: 1
      name: "PowerShell_Rubeus_Load"
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["powershell.exe"] }
        CommandLine: { regex: ".*Rubeus.*" }
    - step_id: 2
      name: "Unsigned_Assembly_Load"
      temporal_link: { previous_step: 1, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 120 }
      matching_criteria:
        Node_Type: "File"
        Extension: ".dll"
        IsSigned: false
    - step_id: 3
      name: "Ticket_Request"
      temporal_link: { previous_step: 2, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 120 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["powershell.exe"] }
        CommandLine: { regex: ".*kerberoast.*" }
actionable_hunting_outputs:
  validation_queries:
    - engine: "KQL"
      query: "DeviceProcessEvents | where FileName == 'powershell.exe' and ProcessCommandLine has_any ('Rubeus','kerberoast')"
