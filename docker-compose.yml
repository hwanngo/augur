name: augur

services:
  # ── FastAPI app + dashboard ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: augur:latest
    container_name: augur-app
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      # Use the Neo4j backend inside the compose network.
      AUGUR_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      AUGUR_LOGS: sample_data/corpus/enterprise_day.jsonl
      # ── Auth (see docs / .env.example) ──
      AUGUR_ENV: prod
      AUGUR_SECRET_KEY: ${AUGUR_SECRET_KEY:?set AUGUR_SECRET_KEY in .env}
      # The bundled stack serves plain HTTP on :8000, so Secure cookies are OFF by default.
      # Put a TLS-terminating reverse proxy in front and set this to true for real deployments.
      AUGUR_COOKIE_SECURE: ${AUGUR_COOKIE_SECURE:-false}
      AUGUR_DB: /data/augur.db          # persisted on the fs_data volume
      AUGUR_ADMIN_USER: ${AUGUR_ADMIN_USER:-admin}
      AUGUR_ADMIN_PASSWORD: ${AUGUR_ADMIN_PASSWORD:?set AUGUR_ADMIN_PASSWORD in .env}
    ports:
      - "8000:8000"
    volumes:
      - fs_data:/data                                # auth sqlite DB survives restarts
    networks:
      - augur
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/ready').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Neo4j temporal knowledge graph backend ──────────────────────────────
  neo4j:
    image: neo4j:5.26
    container_name: augur-neo4j
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}   # consumed by the healthcheck below
      NEO4J_server_memory_pagecache_size: "512M"
      NEO4J_server_memory_heap_initial__size: "512M"
      NEO4J_server_memory_heap_max__size: "1G"
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - augur
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_PASSWORD}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

networks:
  augur:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  fs_data:        # persistent sqlite auth store (users/sessions/audit)
