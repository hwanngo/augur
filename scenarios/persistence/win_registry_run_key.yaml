scenario_metadata:
  scenario_id: "SCEN-WIN-006"
  name: "Registry Run Key Persistence via reg.exe"
  description: "Adversary adds a value to HKCU\\Run via reg.exe to persist a PowerShell payload across reboots."
  severity: "HIGH"
  mitre_mappings:
    - { tactic: "TA0003", technique: "T1547.001" }
  os_family: "windows"
spatial_constraints:
  applicable_zones: ["User_Endpoint", "Internal_Server"]
  critical_assets_only: false
  required_log_sources: ["Windows_Sysmon"]
attack_sequence_flow:
  steps:
    - step_id: 1
      name: "Reg_Add_Run_Key"
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["reg.exe"] }
        CommandLine: { regex: ".*Run.*" }
    - step_id: 2
      name: "PowerShell_Reexec"
      temporal_link: { previous_step: 1, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 300 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["powershell.exe"] }
        CommandLine: { regex: ".*payload.*" }
    - step_id: 3
      name: "Confirm_Persistence"
      temporal_link: { previous_step: 2, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 300 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["reg.exe"] }
        CommandLine: { regex: ".*query.*" }
actionable_hunting_outputs:
  validation_queries:
    - engine: "KQL"
      query: "DeviceRegistryEvents | where RegistryKey has 'Run' and ActionType == 'RegistryValueSet'"
