scenario_metadata:
  scenario_id: "SCEN-MAC-007"
  name: "macOS curl Payload Download and Execution"
  description: "Adversary uses curl to download a payload, marks it executable with chmod, and executes it as a second stage."
  severity: "HIGH"
  mitre_mappings:
    - { tactic: "TA0011", technique: "T1105" }
  os_family: "macos"
spatial_constraints:
  applicable_zones: ["User_Endpoint"]
  critical_assets_only: false
  required_log_sources: ["macOS_ESF"]
attack_sequence_flow:
  steps:
    - step_id: 1
      name: "Download_Payload"
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["curl"] }
        CommandLine: { regex: ".*payload.*" }
    - step_id: 2
      name: "Mark_Executable"
      temporal_link: { previous_step: 1, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 120 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["chmod"] }
        CommandLine: { regex: ".*x.*" }
    - step_id: 3
      name: "Execute_Payload"
      temporal_link: { previous_step: 2, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 120 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["sh", "bash"] }
        CommandLine: { regex: ".*run.*" }
actionable_hunting_outputs:
  validation_queries:
    - engine: "KQL"
      query: "DeviceProcessEvents | where FileName == 'curl' and ProcessCommandLine has 'payload'"
