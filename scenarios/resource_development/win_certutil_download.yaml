scenario_metadata:
  scenario_id: "SCEN-WIN-003"
  name: "Certutil LOLBin Download and Unsigned PE Drop"
  description: "Adversary uses certutil.exe -urlcache to download a payload, which lands as an unsigned PE on disk."
  severity: "HIGH"
  mitre_mappings:
    - { tactic: "TA0042", technique: "T1587.001" }
  os_family: "windows"
spatial_constraints:
  applicable_zones: ["User_Endpoint", "Internal_Server"]
  critical_assets_only: false
  required_log_sources: ["Windows_Sysmon"]
attack_sequence_flow:
  steps:
    - step_id: 1
      name: "Certutil_Download"
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["certutil.exe"] }
        CommandLine: { regex: ".*urlcache.*" }
    - step_id: 2
      name: "Unsigned_PE_Drop"
      temporal_link: { previous_step: 1, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 120 }
      matching_criteria:
        Node_Type: "File"
        Extension: ".exe"
        IsSigned: false
    - step_id: 3
      name: "Execute_Dropped_Binary"
      temporal_link: { previous_step: 2, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 300 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["cmd.exe", "powershell.exe"] }
        CommandLine: { regex: ".*payload.*" }
actionable_hunting_outputs:
  validation_queries:
    - engine: "KQL"
      query: "DeviceProcessEvents | where FileName == 'certutil.exe' and ProcessCommandLine has 'urlcache'"
