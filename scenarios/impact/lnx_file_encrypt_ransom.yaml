scenario_metadata:
  scenario_id: "SCEN-LNX-010"
  name: "Linux Mass File Encryption for Ransomware Impact"
  description: "Adversary uses openssl enc to mass-encrypt files and then drops a ransom note via echo."
  severity: "CRITICAL"
  mitre_mappings:
    - { tactic: "TA0040", technique: "T1486" }
  os_family: "linux"
spatial_constraints:
  applicable_zones: ["Internal_Server", "DMZ"]
  critical_assets_only: false
  required_log_sources: ["Linux_Auditd"]
attack_sequence_flow:
  steps:
    - step_id: 1
      name: "Shell_Init"
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["bash", "sh"] }
    - step_id: 2
      name: "Mass_Encrypt"
      temporal_link: { previous_step: 1, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 300 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["openssl"] }
        CommandLine: { regex: ".*enc.*" }
    - step_id: 3
      name: "Drop_Ransom_Note"
      temporal_link: { previous_step: 2, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 120 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["echo", "tee"] }
        CommandLine: { regex: ".*ransom.*" }
actionable_hunting_outputs:
  validation_queries:
    - engine: "Sigma"
      query: |
        title: Linux Ransomware via OpenSSL
        logsource: { product: linux, category: process_creation }
        detection:
          sel: { Image|endswith: '/openssl', CommandLine|contains: 'enc' }
          condition: sel
        level: critical
