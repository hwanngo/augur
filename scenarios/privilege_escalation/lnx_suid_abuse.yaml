scenario_metadata:
  scenario_id: "SCEN-LNX-004"
  name: "Linux SUID Binary Abuse for Privilege Escalation"
  description: "Adversary finds SUID binaries via find and exploits them to escalate privileges to root, indicated by a behavior marker."
  severity: "HIGH"
  mitre_mappings:
    - { tactic: "TA0004", technique: "T1548.001" }
  os_family: "linux"
spatial_constraints:
  applicable_zones: ["Internal_Server", "DMZ"]
  critical_assets_only: false
  required_log_sources: ["Linux_Auditd"]
attack_sequence_flow:
  steps:
    - step_id: 1
      name: "Find_SUID_Binaries"
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["find"] }
        CommandLine: { regex: ".*perm.*" }
    - step_id: 2
      name: "Copy_SUID_Binary"
      temporal_link: { previous_step: 1, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 300 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["cp", "bash"] }
        CommandLine: { regex: ".*suid.*" }
    - step_id: 3
      name: "Privilege_Escalation_Behavior"
      temporal_link: { previous_step: 2, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 300 }
      matching_criteria:
        Node_Type: "Process"
        Behavior_Markers: ["privilege_escalation"]
actionable_hunting_outputs:
  validation_queries:
    - engine: "Sigma"
      query: |
        title: SUID Binary Privilege Escalation
        logsource: { product: linux, category: process_creation }
        detection:
          sel: { Image|endswith: '/find', CommandLine|contains: '-perm' }
          condition: sel
        level: high
