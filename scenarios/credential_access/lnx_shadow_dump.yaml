scenario_metadata:
  scenario_id: "SCEN-LNX-006"
  name: "Linux /etc/shadow Dump and Offline Cracking"
  description: "Adversary reads the shadow password file via cat and then runs john or unshadow to crack credentials offline."
  severity: "CRITICAL"
  mitre_mappings:
    - { tactic: "TA0006", technique: "T1003.008" }
  os_family: "linux"
spatial_constraints:
  applicable_zones: ["Internal_Server", "DMZ"]
  critical_assets_only: false
  required_log_sources: ["Linux_Auditd"]
attack_sequence_flow:
  steps:
    - step_id: 1
      name: "Spawn_Shell"
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["bash", "sh"] }
    - step_id: 2
      name: "Read_Shadow_File"
      temporal_link: { previous_step: 1, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 120 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["cat"] }
        CommandLine: { regex: ".*shadow.*" }
    - step_id: 3
      name: "Offline_Crack"
      temporal_link: { previous_step: 2, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 300 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["john", "unshadow"] }
actionable_hunting_outputs:
  validation_queries:
    - engine: "Sigma"
      query: |
        title: Shadow File Access
        logsource: { product: linux, category: process_creation }
        detection:
          sel: { Image|endswith: '/cat', CommandLine|contains: 'shadow' }
          condition: sel
        level: critical
