scenario_metadata:
  scenario_id: "SCEN-LNX-003"
  name: "Bash Pipe-to-Shell Remote Code Execution"
  description: "Adversary uses bash -c to spawn curl, piping the downloaded script directly to sh for execution."
  severity: "HIGH"
  mitre_mappings:
    - { tactic: "TA0002", technique: "T1059.004" }
  os_family: "linux"
spatial_constraints:
  applicable_zones: ["Internal_Server", "DMZ"]
  critical_assets_only: false
  required_log_sources: ["Linux_Auditd"]
attack_sequence_flow:
  steps:
    - step_id: 1
      name: "Bash_C_Flag"
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["bash"] }
        CommandLine: { regex: ".*-c.*" }
    - step_id: 2
      name: "Curl_Download_Script"
      temporal_link: { previous_step: 1, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 120 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["curl"] }
        CommandLine: { regex: ".*sh.*" }
    - step_id: 3
      name: "Shell_Execute_Script"
      temporal_link: { previous_step: 2, link_scope: same_host, min_time_delta_seconds: 0, max_time_delta_seconds: 120 }
      matching_criteria:
        Node_Type: "Process"
        ProcessName: { in: ["sh", "bash"] }
        ParentProcessName: { in: ["curl", "bash"] }
actionable_hunting_outputs:
  validation_queries:
    - engine: "Sigma"
      query: |
        title: Bash Pipe to Shell
        logsource: { product: linux, category: process_creation }
        detection:
          sel: { Image|endswith: '/curl', CommandLine|contains: 'sh' }
          condition: sel
        level: high
